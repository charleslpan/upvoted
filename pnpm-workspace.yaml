packages:
  - apps/*
  - packages/*

# Versions shared by several packages. Reference them as "catalog:" in a package.json.
catalog:
  "@types/node": ^22.20.5
  typescript: ^6.0.3
  vitest: ^5.1.0
  zod: ^4.6.7

# Dependencies allowed to run install scripts. ffmpeg-static downloads its binary on install.
allowBuilds:
  "@mongodb-js/zstd": false
  "@swc/core": false
  cbor-extract: false
  esbuild: false
  ffmpeg-static: true
  # Optional native codecs of just-bash (the agent's sandbox), which needs neither.
  node-liblzma: false

minimumReleaseAgeExclude:
  - eve@1.0.0-rc.2

# eve's build bundles the agent's imports of @upvoted/* but loads those packages' own
# dependencies from the root node_modules, so hoist them there. Add a runtime dependency of
# @upvoted/features or @upvoted/lib here too.
publicHoistPattern:
  - "@mozilla/readability"
  - "@vercel/blob"
  - ai
  - ffmpeg-static
  - linkedom
  - zod
